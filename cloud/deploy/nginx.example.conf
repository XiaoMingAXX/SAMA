# Include only in a separately reviewed nginx site. Replace hostname and certificate paths.
server {
    listen 443 ssl;
    server_name plants.example.com;
    ssl_certificate /etc/ssl/sama/fullchain.pem;
    ssl_certificate_key /etc/ssl/sama/privkey.pem;
    client_max_body_size 11m;
    location / {
        proxy_pass http://127.0.0.1:18890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
